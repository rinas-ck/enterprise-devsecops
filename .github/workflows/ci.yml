name: DevSecOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test-build-scan:
    name: Test, Build, Scan and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff==0.14.2

      - name: Run Ruff lint
        run: ruff check services/ tests/

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install Checkov
        run: python -m pip install checkov==3.3.30

      - name: Scan Kubernetes manifests with Checkov
        run: checkov -d k8s/ --framework kubernetes

      - name: SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Enforce SonarQube quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Build API Docker image
        run: docker build -t devsecops-api:${{ github.sha }} .

      - name: Build Auth Docker image
        run: docker build -t devsecops-auth:${{ github.sha }} -f services/auth/Dockerfile services/auth

      - name: Build Catalog Docker image
        run: docker build -t devsecops-catalog:${{ github.sha }} -f services/catalog/Dockerfile services/catalog

      - name: Build Orders Docker image
        run: docker build -t devsecops-orders:${{ github.sha }} -f services/orders/Dockerfile services/orders

      - name: Build Notifications Docker image
        run: docker build -t devsecops-notifications:${{ github.sha }} -f services/notifications/Dockerfile services/notifications

      - name: Scan API image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.69.3 image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            devsecops-api:${{ github.sha }}

      - name: Enforce API critical vulnerability gate
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/" \
            ghcr.io/aquasecurity/trivy:0.69.3 image \
            --scanners vuln \
            --severity CRITICAL \
            --exit-code 1 \
            devsecops-api:${{ github.sha }}


      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3.9.2

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image owner
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: image-owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Publish and sign all images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_OWNER: ${{ steps.image-owner.outputs.owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          for service in api auth catalog orders notifications; do
            IMAGE="ghcr.io/${IMAGE_OWNER}/devsecops-${service}"
            echo "Publishing ${IMAGE}:${IMAGE_TAG}"

            docker tag "devsecops-${service}:${IMAGE_TAG}" "${IMAGE}:${IMAGE_TAG}"
            docker push "${IMAGE}:${IMAGE_TAG}"

            DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"

            if ! echo "$DIGEST" | grep -qE '^sha256:[a-f0-9]{64}$'; then
              echo "ERROR: Invalid image digest for ${IMAGE}: ${DIGEST}"
              exit 1
            fi

            echo "Signing ${IMAGE}@${DIGEST}"
            cosign sign --yes "${IMAGE}@${DIGEST}"
          done
