apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: devsecops-api-canary
  namespace: devsecops
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 60
  progressDeadlineAbort: true
  selector:
    matchLabels:
      app: devsecops-api-canary
  template:
    metadata:
      labels:
        app: devsecops-api-canary
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: devsecops-api:1.0.3
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause:
            duration: 20s
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: devsecops-api-canary
  namespace: devsecops
spec:
  type: ClusterIP
  selector:
    app: devsecops-api-canary
  ports:
    - name: http
      port: 8000
      targetPort: http
