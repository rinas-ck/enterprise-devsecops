apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devsecops-api-ingress
  namespace: devsecops
spec:
  podSelector:
    matchLabels:
      app: devsecops-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
